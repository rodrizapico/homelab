x-linuxserver-env: &linuxserver-env
  PUID: ${UID}
  PGID: ${GID}
  TZ: ${TZ}

include:
  - ./lldap/compose.yml
  - ./authelia/compose.yml
  - ./caddy/compose.yml
  - ./transmission/compose.yml

services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      <<: *linuxserver-env
    volumes:
      - ${CONFIG_VOLUMES_PATH}/prowlarr:/config
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      <<: *linuxserver-env
    volumes:
      - ${CONFIG_VOLUMES_PATH}/sonarr:/config
      - ${DATA_VOLUMES_PATH}:/data
    restart: unless-stopped

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      <<: *linuxserver-env
    volumes:
      - ${CONFIG_VOLUMES_PATH}/jellyfin:/config
      - ${DATA_VOLUMES_PATH}/media:/data/media
    restart: unless-stopped

  dashy:
    image: lissy93/dashy
    container_name: dashy
    environment:
      <<: *linuxserver-env
    volumes:
      - ${CONFIG_VOLUMES_PATH}/dashy:/app/user-data
    restart: unless-stopped
