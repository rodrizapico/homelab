services:
  lldap:
    image: lldap/lldap:stable
    container_name: lldap
    secrets:
      [
        JWT_SECRET,
        KEY_SEED,
        ADMIN_PASSWORD,
        POSTGRES_CONNECTION_STRING,
        SERVICE_PASSWORD_AUTHELIA,
      ]
    environment:
      UID: ${UID}
      GID: ${GID}
      TZ: ${TZ}

      # LLDAP config
      LLDAP_JWT_SECRET_FILE: /run/secrets/JWT_SECRET
      LLDAP_KEY_SEED_FILE: /run/secrets/KEY_SEED
      LLDAP_LDAP_BASE_DN: ${LDAP_BASE_DN}
      LLDAP_LDAP_USER_PASS_FILE: /run/secrets/ADMIN_PASSWORD
      LLDAP_DATABASE_URL_FILE: /run/secrets/POSTGRES_CONNECTION_STRING

      # bootstrap.sh config
      LLDAP_URL: http://localhost:17170
      LLDAP_ADMIN_PASSWORD_FILE: /run/secrets/ADMIN_PASSWORD
      USER_CONFIGS_DIR: /bootstrap/user_configs
      GROUP_CONFIGS_DIR: /bootstrap/group_configs

      # Service user passwords
      SERVICE_PASSWORD_AUTHELIA_FILE: /run/secrets/SERVICE_PASSWORD_AUTHELIA
    volumes:
      - ./bootstrap:/bootstrap
      - ${CONFIG_VOLUMES_PATH}/lldap:/data
    post_start:
      - command: /bootstrap/bootstrap.sh
    restart: unless-stopped

  db:
    image: postgres
    container_name: db
    secrets: [POSTGRES_PASSWORD]
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/POSTGRES_PASSWORD
      POSTGRES_DB: lldap
    volumes:
      - db:/var/lib/postgresql/data
    shm_size: 128mb
    restart: unless-stopped

volumes:
  db:

secrets:
  JWT_SECRET:
    file: ./secrets/JWT_SECRET
  KEY_SEED:
    file: ./secrets/KEY_SEED
  ADMIN_PASSWORD:
    file: ./secrets/ADMIN_PASSWORD
  POSTGRES_PASSWORD:
    file: ./secrets/POSTGRES_PASSWORD
  POSTGRES_CONNECTION_STRING:
    file: ./secrets/POSTGRES_CONNECTION_STRING
  SERVICE_PASSWORD_AUTHELIA:
    file: ./secrets/SERVICE_PASSWORD_AUTHELIA
