services:
  authelia:
    image: authelia/authelia
    container_name: authelia
    secrets:
      [
        RESET_PASSWORD_JWT_SECRET,
        LDAP_PASSWORD,
        SESSION_SECRET,
        STORAGE_ENCRYPTION_KEY,
        OIDC_HMAC_SECRET,
        OIDC_JWKS_PRIVATE_KEY,
        OIDC_JELLYFIN_CLIENT_ID,
        OIDC_JELLYFIN_CLIENT_SECRET,
        OIDC_HEDGEDOC_CLIENT_ID,
        OIDC_HEDGEDOC_CLIENT_SECRET,
        AUTHELIA_POSTGRES_PASSWORD,
        AUTHELIA_REDIS_PASSWORD,
        SMTP_PASSWORD,
      ]
    environment:
      PUID: ${UID}
      PGID: ${GID}
      TZ: ${TZ}
      BASE_DOMAIN: ${BASE_DOMAIN}
      X_AUTHELIA_CONFIG: /config
      X_AUTHELIA_CONFIG_FILTERS: template
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: /run/secrets/RESET_PASSWORD_JWT_SECRET
      AUTHELIA_AUTHENTICATION_BACKEND_LDAP_BASE_DN: ${LDAP_BASE_DN}
      AUTHELIA_AUTHENTICATION_BACKEND_LDAP_USER: uid=authelia,ou=people,${LDAP_BASE_DN}
      AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD_FILE: /run/secrets/LDAP_PASSWORD
      AUTHELIA_SESSION_SECRET_FILE: /run/secrets/SESSION_SECRET
      AUTHELIA_SESSION_REDIS_PASSWORD_FILE: /run/secrets/AUTHELIA_REDIS_PASSWORD
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /run/secrets/STORAGE_ENCRYPTION_KEY
      AUTHELIA_STORAGE_POSTGRES_PASSWORD_FILE: /run/secrets/AUTHELIA_POSTGRES_PASSWORD
      AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET_FILE: /run/secrets/OIDC_HMAC_SECRET
      AUTHELIA_NOTIFIER_SMTP_PASSWORD_FILE: /run/secrets/SMTP_PASSWORD
    volumes:
      - ./config:/config
    restart: unless-stopped

  authelia_db:
    image: postgres
    container_name: authelia_db
    secrets: [AUTHELIA_POSTGRES_PASSWORD]
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/AUTHELIA_POSTGRES_PASSWORD
      POSTGRES_DB: authelia
    volumes:
      - authelia_db:/var/lib/postgresql/data
    shm_size: 128mb
    restart: unless-stopped

  authelia_cache:
    image: bitnami/redis
    container_name: authelia_cache
    secrets: [AUTHELIA_REDIS_PASSWORD]
    environment:
      REDIS_PASSWORD_FILE: /run/secrets/AUTHELIA_REDIS_PASSWORD
    volumes:
      - authelia_cache:/bitnami
    restart: unless-stopped

volumes:
  authelia_db:
  authelia_cache:

secrets:
  RESET_PASSWORD_JWT_SECRET:
    file: ./secrets/RESET_PASSWORD_JWT_SECRET
  LDAP_PASSWORD:
    file: ./secrets/LDAP_PASSWORD
  SESSION_SECRET:
    file: ./secrets/SESSION_SECRET
  STORAGE_ENCRYPTION_KEY:
    file: ./secrets/STORAGE_ENCRYPTION_KEY
  OIDC_HMAC_SECRET:
    file: ./secrets/OIDC_HMAC_SECRET
  OIDC_JWKS_PRIVATE_KEY:
    file: ./secrets/OIDC_JWKS_PRIVATE_KEY
  OIDC_JELLYFIN_CLIENT_ID:
    file: ./secrets/OIDC_JELLYFIN_CLIENT_ID
  OIDC_JELLYFIN_CLIENT_SECRET:
    file: ./secrets/OIDC_JELLYFIN_CLIENT_SECRET
  OIDC_HEDGEDOC_CLIENT_ID:
    file: ./secrets/OIDC_HEDGEDOC_CLIENT_ID
  OIDC_HEDGEDOC_CLIENT_SECRET:
    file: ./secrets/OIDC_HEDGEDOC_CLIENT_SECRET
  AUTHELIA_POSTGRES_PASSWORD:
    file: ./secrets/POSTGRES_PASSWORD
  AUTHELIA_REDIS_PASSWORD:
    file: ./secrets/REDIS_PASSWORD
  SMTP_PASSWORD:
    file: ./secrets/SMTP_PASSWORD
