
services:
  lldap:
    image: lldap/lldap:stable
    container_name: lldap
    environment:
      UID: ${UID}
      GID: ${GID}
      TZ:  ${TZ}
    volumes:
      - ${CONFIG_VOLUMES_PATH}/lldap:/data
    restart: unless-stopped
    
  authelia:
    image: authelia/authelia
    container_name: authelia
    secrets: [
      AUTHELIA_RESET_PASSWORD_JWT_SECRET,
      AUTHELIA_LDAP_PASSWORD,
      AUTHELIA_SESSION_SECRET,
      AUTHELIA_STORAGE_ENCRYPTION_KEY,
      AUTHELIA_OIDC_HMAC_SECRET,
      AUTHELIA_OIDC_JWKS_PRIVATE_KEY,
      AUTHELIA_OIDC_JELLYFIN_CLIENT_ID,
      AUTHELIA_OIDC_JELLYFIN_CLIENT_SECRET
    ]
    environment:
      PUID: ${UID}
      PGID: ${GID}
      TZ:   ${TZ}
      BASE_DOMAIN: docker.services.buen.ga
      X_AUTHELIA_CONFIG: /config/config_files
      X_AUTHELIA_CONFIG_FILTERS: template
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: /run/secrets/AUTHELIA_RESET_PASSWORD_JWT_SECRET
      AUTHELIA_AUTHENTICATION_BACKEND_LDAP_BASE_DN: dc=buen,dc=ga
      AUTHELIA_AUTHENTICATION_BACKEND_LDAP_USER: uid=authelia,ou=people,dc=buen,dc=ga
      AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD_FILE:  /run/secrets/AUTHELIA_LDAP_PASSWORD
      AUTHELIA_SESSION_SECRET_FILE: /run/secrets/AUTHELIA_SESSION_SECRET
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /run/secrets/AUTHELIA_STORAGE_ENCRYPTION_KEY
      AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET_FILE: /run/secrets/AUTHELIA_OIDC_HMAC_SECRET
    volumes:
      - ${CONFIG_VOLUMES_PATH}/authelia:/config
      - ./config:/config/config_files
    restart: unless-stopped

secrets:
  AUTHELIA_RESET_PASSWORD_JWT_SECRET:
    file: ./secrets/RESET_PASSWORD_JWT_SECRET
  AUTHELIA_LDAP_PASSWORD:
    file: ./secrets/LDAP_PASSWORD
  AUTHELIA_SESSION_SECRET:
    file: ./secrets/SESSION_SECRET
  AUTHELIA_STORAGE_ENCRYPTION_KEY:
    file: ./secrets/STORAGE_ENCRYPTION_KEY
  AUTHELIA_OIDC_HMAC_SECRET:
    file: ./secrets/OIDC_HMAC_SECRET
  AUTHELIA_OIDC_JWKS_PRIVATE_KEY:
    file: ./secrets/OIDC_JWKS_PRIVATE_KEY
  AUTHELIA_OIDC_JELLYFIN_CLIENT_ID:
    file: ./secrets/OIDC_JELLYFIN_CLIENT_ID
  AUTHELIA_OIDC_JELLYFIN_CLIENT_SECRET:
    file: ./secrets/OIDC_JELLYFIN_CLIENT_SECRET
