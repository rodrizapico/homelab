auth:
  - user: samba
    group: samba
    uid: 1000
    gid: 1000
    password: bar
    password_file: ${SAMBA_PASSWORD_FILE}

global:
  - "force user = samba"
  - "force group = samba"

share:
  - name: share
    path: /samba/share
    browsable: yes
    readonly: no
    guestok: yes
  - name: media
    path: /samba/media
    browsable: yes
    readonly: yes
    guestok: yes
  - name: downloads
    path: /samba/downloads
    browsable: yes
    readonly: yes
    guestok: yes
