appConfig:
  language: en
  layout: auto
  iconSize: medium
  theme: nord-frost
  startingView: default
  defaultOpeningMethod: newtab
  statusCheck: true
  statusCheckInterval: 30
  faviconApi: allesedv
  routingMode: history
  enableMultiTasking: false
  widgetsAlwaysUseProxy: false
  webSearch:
    disableWebSearch: false
    searchEngine: duckduckgo
    openingMethod: newtab
    searchBangs: {}
  enableFontAwesome: true
  enableMaterialDesignIcons: false
  hideComponents:
    hideHeading: false
    hideNav: false
    hideSearch: false
    hideSettings: false
    hideFooter: false
  auth:
    enableGuestAccess: false
    users: []
    enableOidc: false
    enableHeaderAuth: false
    headerAuth:
      userHeader: REMOTE_USER
      proxyWhitelist: []
    enableKeycloak: false
  showSplashScreen: false
  preventWriteToDisk: false
  preventLocalSave: false
  disableConfiguration: false
  disableConfigurationForNonAdmin: false
  allowConfigEdit: true
  enableServiceWorker: false
  disableContextMenu: false
  disableUpdateChecks: false
  disableSmartSort: false
  enableErrorReporting: false
pageInfo:
  title: Dashy
sections:
  - name: Media
    icon: far fa-photo-video
    items:
      - title: Sonarr
        icon: hl-sonarr
        url: https://sonarr.docker.services.buen.ga/
        id: 0_480_sonarr
      - title: Prowlarr
        icon: hl-prowlarr
        url: https://prowlarr.docker.services.buen.ga/
        id: 1_480_prowlarr
      - title: Transmission
        icon: hl-transmission
        url: https://transmission.docker.services.buen.ga/
        statusCheckUrl: http://transmission_vpn_client:9091
        id: 2_480_transmission
      - title: Jellyfin
        icon: hl-jellyfin
        url: https://jellyfin.docker.services.buen.ga/
        id: 3_480_jellyfin
    displayData:
      sortBy: default
      rows: 1
      cols: 1
      collapsed: false
      hideForGuests: false
  - name: Instance management
    icon: far fa-tools
    items:
      - title: Light LDAP
        icon: hl-authelia
        url: https://lldap.docker.services.buen.ga/
        id: 0_1906_lightldap
  - name: Other
    icon: far fa-plus
    displayData:
      sortBy: default
      rows: 1
      cols: 1
      collapsed: false
      hideForGuests: false
    items:
      - title: HedgeDoc
        icon: hl-hedgedoc
        url: https://hedgedoc.docker.services.buen.ga/
        target: newtab
        id: 0_514_hedgedoc
