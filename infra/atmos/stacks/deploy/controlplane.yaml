vars:
  stage: controlplane

import:
  - deploy/_defaults
  - catalog/vm/md

components:
  terraform:
    devpod:
      metadata:
        inherits:
          - vm/md
      vars:
        vm_name: devpod
        vlan_tag: 120
        nixos_flake:
          path: !exec echo "$(git rev-parse --show-toplevel)/infra/nixos"
          configuration_name: devpod
    garageS3:
      metadata:
        inherits:
          - vm/md
      vars:
        vm_name: garageS3
        nixos_flake:
          path: !exec echo "$(git rev-parse --show-toplevel)/infra/nixos"
          configuration_name: garage_s3
