vars:
  stage: controlplane

import:
  - deploy/_defaults
  - catalog/vm/md
  - catalog/vm/xl

components:
  terraform:
    devpod:
      metadata:
        inherits:
          - vm/xl
      vars:
        name: devpod
        hardware:
          networking:
            vlan_tag: 120
        nixos:
          flake:
            configuration_name: devpod
