import:
  - catalog/vm/md
  - catalog/vm/2xl
  - catalog/k3s/defaults

components:
  terraform:
    mirror-devpod:
      metadata:
        inherits:
          - vm/2xl
      vars:
        config:
          name: mirror-devpod
          os_preset: devpod
    arch:
      metadata:
        inherits:
          - vm/md
      vars:
        config:
          name: arch
          advanced:
            proxmox:
              vm_template: arch-cloudinit-template
    k3s-cluster:
      metadata:
        inherits:
          - k3s/defaults
      vars:
        config:
          name: cluster
