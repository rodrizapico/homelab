import:
  - catalog/vm/md
  - catalog/vm/2xl

components:
  terraform:
    mirror-devpod:
      metadata:
        inherits:
          - vm/2xl
      vars:
        config:
          name: mirror-devpod
          os_preset: devpod
    arch:
      metadata:
        inherits:
          - vm/md
      vars:
        config:
          name: arch
          advanced:
            proxmox:
              vm_template: arch-cloudinit-template
    k3s-server-1:
      metadata:
        inherits:
          - vm/md
      vars:
        config:
          name: k3s-server-1
          os_preset: k3s_server
          os_preset_options:
            k3s_cluster_init: true
            k3s_cluster_token: !env K3S_CLUSTER_TOKEN
    k3s-server-2:
      metadata:
        inherits:
          - vm/md
      vars:
        config:
          name: k3s-server-2
          os_preset: k3s_server
          os_preset_options:
            k3s_cluster_token: !env K3S_CLUSTER_TOKEN
            k3s_server_addr: !terraform.output k3s-server-1 ".ipv4_address | ""https://"" + . + "":6443"""
    k3s-server-3:
      metadata:
        inherits:
          - vm/md
      vars:
        config:
          name: k3s-server-3
          os_preset: k3s_server
          os_preset_options:
            k3s_cluster_token: !env K3S_CLUSTER_TOKEN
            k3s_server_addr: !terraform.output k3s-server-1 ".ipv4_address | ""https://"" + . + "":6443"""
