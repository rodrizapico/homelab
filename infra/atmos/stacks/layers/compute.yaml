import:
  - catalog/proxmox/vm/ubuntu/noble
  - catalog/proxmox/vm/nixos

components:
  terraform:
    proxmox/vm/ubuntu/noble/test:
      metadata:
        inherits:
          - proxmox/vm/ubuntu/noble
      vars:
        config:
          name: ubuntu-noble-test

    proxmox/vm/nixos/text:
      metadata:
        inherits:
          - proxmox/vm/nixos
      vars:
        config:
          name: nixos-test
        nixos_config:
          preset: devpod
