import:
  - catalog/vm/defaults
  - catalog/k3s/defaults

components:
  terraform:
    mirror-devpod:
      metadata:
        inherits:
          - vm/defaults
      vars:
        config:
          name: mirror-devpod
          os_preset: devpod
          hardware_preset: xxl
          advanced:
            proxmox:
              allowed_nodes: [devimon]

    arch:
      metadata:
        inherits:
          - vm/defaults
      vars:
        config:
          name: arch
          hardware_preset: md
          advanced:
            proxmox:
              vm_template_id: 1000

    k3s-cluster:
      metadata:
        inherits:
          - k3s/defaults
      vars:
        config:
          name: cluster

    ubuntu-template:
      metadata:
        component: proxmox/template_vm
      vars:
        config:
          name: ubuntu
          node: agumon
          image:
            url: https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
            file_name: ubuntu-24-noble-server-cloudimg-amd64.qcow2

    ubuntu-vm:
      metadata:
        component: proxmox/vm
      vars:
        config:
          name: ubuntu
          node: agumon
          template_id: !terraform.state ubuntu-template id
          hardware_preset: "md"
          user:
            name: buengabacho
            ssh_keys:
              - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBGuvLnYXThp0dvDp/W7mZOnnpE9i+NClbYJwx5hsHIU # Bitwarden SSH key

    ubuntu-vm-2:
      metadata:
        component: proxmox/vm
      vars:
        config:
          name: ubuntu-2
          node: agumon
          template_id: !terraform.state ubuntu-template id
          hardware_preset: "md"
          user:
            name: buengabacho
            ssh_keys:
              - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBGuvLnYXThp0dvDp/W7mZOnnpE9i+NClbYJwx5hsHIU # Bitwarden SSH key
          advanced:
            ip_config:
              ipv4:
                address: 192.168.140.20/24
                gateway: 192.168.140.1
